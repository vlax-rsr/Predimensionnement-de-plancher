[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "predim-plancher"
version = "1.0.0"
description = "Prédimensionnement comparatif de planchers (dalle pleine vs corps creux)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Predim-Plancher contributors" }]
keywords = ["génie civil", "béton armé", "plancher", "prédimensionnement"]
license = { text = "MIT" }
dependencies = ["PySide6>=6.6", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
predim-plancher = "predim_plancher.gui.app:main"

[tool.setuptools.packages.find]
include = ["predim_plancher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
